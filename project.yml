name: LiveMaterialPhone
options:
  bundleIdPrefix: local.livematerial
  deploymentTarget:
    iOS: '18.0'
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  LiveMaterialPhone:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.livematerial.phone
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  LiveMaterialPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: LiveMaterialPhone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LiveMaterialPhone:
    build:
      targets:
        LiveMaterialPhone: all
    test:
      targets:
        - LiveMaterialPhoneTests
